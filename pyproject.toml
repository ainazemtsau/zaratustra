[project]
name = "zaratustra"
version = "0.1.0"
description = "Zaratustra local workspace foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
zara = "zaratustra.cli:main"

[build-system]
requires = ["uv_build==0.8.22"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_package = "zaratustra"

[[tool.importlinter.contracts]]
name = "CLI may depend on Core, Core cannot depend on CLI"
type = "layers"
layers = ["zaratustra.cli", "zaratustra.core"]

[[tool.importlinter.contracts]]
name = "Core has no surface dependency"
type = "forbidden"
source_modules = ["zaratustra.core"]
forbidden_modules = ["zaratustra.cli"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]
