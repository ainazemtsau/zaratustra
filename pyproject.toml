[project]
name = "zaratustra"
version = "0.21.0"
description = "Zaratustra local workspace and transactional mutation protocol"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
zara = "zaratustra.cli:main"
zara-agent = "zaratustra.trusted_chat.agent:main"
zara-home = "zaratustra.commands.__main__:main"

[build-system]
requires = ["uv_build==0.8.22"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.uv.build-backend]
# Exclude the directories themselves, including leftovers from older checkouts.
source-exclude = ["src/zaratustra/fictional_lot", "src/zaratustra/process_probe"]

[[tool.importlinter.contracts]]
name = "Standard connection resources have no product authority dependency"
type = "forbidden"
source_modules = ["zaratustra.connections"]
forbidden_modules = ["zaratustra.core", "zaratustra.entry", "zaratustra.onboarding", "zaratustra.process_creation", "zaratustra.process_change", "zaratustra.process_packs", "zaratustra.local", "zaratustra.cli", "tests", "tools"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["zaratustra", "tests", "tools"]

[[tool.importlinter.contracts]]
name = "Installed product never imports development tests or tools"
type = "forbidden"
source_modules = ["zaratustra"]
forbidden_modules = ["tests", "tools"]

[[tool.importlinter.contracts]]
name = "CLI may depend on Core, Core cannot depend on CLI"
type = "layers"
layers = ["zaratustra.cli", "zaratustra.local", "zaratustra.core"]

[[tool.importlinter.contracts]]
name = "Core has no surface dependency"
type = "forbidden"
source_modules = ["zaratustra.core"]
forbidden_modules = ["zaratustra.cli", "zaratustra.entry", "zaratustra.intake", "zaratustra.local", "zaratustra.home", "zaratustra.commands", "zaratustra.journal"]

[[tool.importlinter.contracts]]
name = "Entry catalog depends only on Core"
type = "forbidden"
source_modules = ["zaratustra.entry"]
forbidden_modules = ["zaratustra.cli", "zaratustra.local", "zaratustra.process_packs"]

[[tool.importlinter.contracts]]
name = "Incoming material coordinator depends only on Core"
type = "forbidden"
source_modules = ["zaratustra.intake"]
forbidden_modules = ["zaratustra.cli", "zaratustra.entry", "zaratustra.local", "zaratustra.process_packs"]

[[tool.importlinter.contracts]]
name = "First use has no trusted adapter, Pack or development dependency"
type = "forbidden"
source_modules = ["zaratustra.first_use"]
forbidden_modules = ["zaratustra.cli", "zaratustra.local", "zaratustra.process_packs", "tests", "tools"]

[[tool.importlinter.contracts]]
name = "Process creation has no trusted adapter or development dependency"
type = "forbidden"
source_modules = ["zaratustra.process_creation"]
forbidden_modules = ["zaratustra.cli", "zaratustra.local", "tests", "tools"]

[[tool.importlinter.contracts]]
name = "Process change has no trusted adapter or development dependency"
type = "forbidden"
source_modules = ["zaratustra.process_change"]
forbidden_modules = ["zaratustra.cli", "zaratustra.local", "tests", "tools"]

[[tool.importlinter.contracts]]
name = "Public onboarding has no trusted adapter or development dependency"
type = "forbidden"
source_modules = ["zaratustra.onboarding"]
forbidden_modules = ["zaratustra.cli", "zaratustra.local", "tests", "tools"]

[[tool.importlinter.contracts]]
name = "Process probe uses Core; Core has no process-rule dependency"
type = "forbidden"
source_modules = ["zaratustra.core"]
forbidden_modules = ["tests.fixtures.process_probe"]

[[tool.importlinter.contracts]]
name = "Process rules have no trusted adapter dependency"
type = "forbidden"
source_modules = ["tests.fixtures.process_probe"]
forbidden_modules = ["zaratustra.local", "zaratustra.cli"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[[tool.importlinter.contracts]]
name = "Journal has no host, Home registry or legacy workflow dependency"
type = "forbidden"
source_modules = ["zaratustra.journal"]
forbidden_modules = ["zaratustra.commands", "zaratustra.home", "zaratustra.cli", "zaratustra.entry", "zaratustra.process_packs", "zaratustra.trusted_chat"]

[[tool.importlinter.contracts]]
name = "Home Registry has no agent or workflow dependency"
type = "forbidden"
source_modules = ["zaratustra.home"]
forbidden_modules = ["zaratustra.commands", "zaratustra.entry", "zaratustra.cli", "zaratustra.trusted_chat", "zaratustra.process_packs"]

[[tool.importlinter.contracts]]
name = "Common Home commands never depend on a particular agent host"
type = "forbidden"
source_modules = ["zaratustra.commands"]
forbidden_modules = ["zaratustra.cli", "zaratustra.trusted_chat", "zaratustra.process_packs", "zaratustra.process_creation", "zaratustra.process_change"]

[[tool.importlinter.contracts]]
name = "Core has no external pack dependency"
type = "forbidden"
source_modules = ["zaratustra.core"]
forbidden_modules = ["zaratustra.process_packs"]

[[tool.importlinter.contracts]]
name = "Packs have no trusted adapter or fictional probe dependency"
type = "forbidden"
source_modules = ["zaratustra.process_packs"]
forbidden_modules = ["zaratustra.local", "zaratustra.cli", "tests.fixtures.process_probe"]

[[tool.importlinter.contracts]]
name = "Core and generic packs do not depend on fictional signal rules"
type = "forbidden"
source_modules = ["zaratustra.core", "zaratustra.process_packs"]
forbidden_modules = ["tests.fixtures.fictional_signal"]

[[tool.importlinter.contracts]]
name = "Fictional signal has no trusted surface or other fixture dependency"
type = "forbidden"
source_modules = ["tests.fixtures.fictional_signal"]
forbidden_modules = ["zaratustra.local", "zaratustra.cli", "tools", "tests.fixtures.fictional_lot", "tests.fixtures.process_probe"]

[[tool.importlinter.contracts]]
name = "Core and generic packs do not depend on fictional lot rules"
type = "forbidden"
source_modules = ["zaratustra.core", "zaratustra.process_packs"]
forbidden_modules = ["tests.fixtures.fictional_lot"]

[[tool.importlinter.contracts]]
name = "Fictional lot has no trusted surface or probe dependency"
type = "forbidden"
source_modules = ["tests.fixtures.fictional_lot"]
forbidden_modules = ["zaratustra.local", "zaratustra.cli", "tests.fixtures.process_probe"]

[[tool.importlinter.contracts]]
name = "Process construction inputs stay development-only and untrusted"
type = "forbidden"
source_modules = ["tests.fixtures.process_creation"]
forbidden_modules = ["zaratustra.local", "zaratustra.cli", "tools"]

[[tool.importlinter.contracts]]
name = "Process skills depend on journal, not a particular agent or workflow"
type = "forbidden"
source_modules = ["zaratustra.process_skills"]
forbidden_modules = ["zaratustra.commands", "zaratustra.cli", "zaratustra.trusted_chat", "zaratustra.home", "zaratustra.process_packs", "zaratustra.entry"]

[[tool.importlinter.contracts]]
name = "Core and journal have no skill policy dependency"
type = "forbidden"
source_modules = ["zaratustra.core", "zaratustra.journal"]
forbidden_modules = ["zaratustra.process_skills"]

[[tool.importlinter.contracts]]
name = "Web exchange uses public journal and never a host or legacy workflow"
type = "forbidden"
source_modules = ["zaratustra.web_exchange"]
forbidden_modules = ["zaratustra.commands", "zaratustra.home", "zaratustra.cli", "zaratustra.trusted_chat", "zaratustra.entry", "zaratustra.process_packs"]

[[tool.importlinter.contracts]]
name = "Core and journal do not depend on web exchange policy"
type = "forbidden"
source_modules = ["zaratustra.core", "zaratustra.journal"]
forbidden_modules = ["zaratustra.web_exchange"]
